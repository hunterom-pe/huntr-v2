name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (perf + vitals)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Netlify deploy preview
        id: netlify
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            url=$(gh api "repos/$REPO/commits/$SHA/statuses" --jq \
              '.[] | select(.context | test("^netlify/.*/deploy-preview$")) | select(.state=="success") | .target_url' \
              | head -n1)
            if [ -n "$url" ]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Preview ready: $url"
              exit 0
            fi
            echo "[$i/60] Waiting for Netlify deploy preview on $SHA..."
            sleep 15
          done
          echo "Timed out waiting for Netlify preview status"
          exit 1

      - name: Resolve target URL
        id: target
        run: |
          if [ -n "${{ steps.netlify.outputs.url }}" ]; then
            echo "url=${{ steps.netlify.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://www.careerhuntr.io" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (for Playwright perf tests)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright perf tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
          CI: "true"
        run: npx playwright test perf

      - name: Upload Playwright perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npx @lhci/cli@0.14.x autorun \
            --collect.url="${{ steps.target.outputs.url }}" \
            --collect.url="${{ steps.target.outputs.url }}/login" \
            --collect.url="${{ steps.target.outputs.url }}/pricing"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
